name: validate

# Validate all pull requests in this downstream fork, including its own branches.
# Keep upstream's weekly/manual runs and path-gated source replay.
on:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's merge commit and the base it merges into.
          fetch-depth: 2
      - name: Use the example site
        run: scripts/example_site.py
      - name: Validate every shape of the recipe
        run: |
          for shape in $(python3 -c 'import json; print(*json.load(open("config/cluster.json"))["shapes"])'); do
            bin/spark --shape "$shape" doctor
          done
      - name: Compile helper
        run: python3 -m py_compile bin/spark
      - name: Unit tests
        run: |
          # Strict evidence tests reject shared-writable ancestry such as /tmp.
          # Use a private canonical fixture root, not weaker production guards.
          TMPDIR="$(mktemp -d "$(pwd -P)/.unittest-tmp.XXXXXXXX")"
          export TMPDIR
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --require-hashes -r requirements/bench-client.txt
          .venv/bin/python -m unittest discover -s tests
      - name: Validate helpers
        run: |
          # scripts/ holds shell and Python helpers and JSON lab specs; check each by
          # its type (the unit tests above leave __pycache__ behind).
          find scripts -type f -not -path '*/__pycache__/*' -print0 \
            | while IFS= read -r -d '' file; do
                case "$file" in
                  *.py) python3 -m py_compile "$file" ;;
                  *.json) python3 -m json.tool "$file" >/dev/null ;;
                  *.sh) bash -n "$file" ;;
                  *)
                    case "$(head -n1 "$file")" in
                      *python*) python3 -m py_compile "$file" ;;
                      *) bash -n "$file" ;;
                    esac
                    ;;
                esac
              done
          find experiments -type f -name 'prepare-sources' -print0 \
            | while IFS= read -r -d '' file; do
                case "$(head -n1 "$file")" in
                  *python*) python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$file" ;;
                  *) sh -n "$file" ;;
                esac
              done
      - name: Validate JSON
        run: |
          find config manifests experiments -name '*.json' -print0 \
            | xargs -0 -n1 python3 -m json.tool >/dev/null
      - name: Check the pull request's whitespace
        if: github.event_name == 'pull_request'
        # .gitattributes exempts patches and recorded outputs.
        run: git diff --check HEAD^1 HEAD

  # The patch stacks take minutes to fetch: a pull request runs them only when it
  # touches a series, the lock or the helper that prepares them.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      patches: ${{ steps.paths.outputs.patches }}
      steering: ${{ steps.paths.outputs.steering }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qE \
              '^(patches/|upstreams\.lock\.json$|bin/spark$|experiments/[^/]+/(vllm|b12x|nccl[^/]*|tilelang|tile_kernels)/|experiments/2026-10-03-balanced-policy/)'; then
            echo patches=true >> "$GITHUB_OUTPUT"
          else
            echo patches=false >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qE \
              '^(experiments/(2026-10-18-request-steering|2026-10-18-steering-consume|2026-10-19-r6x-steering|2026-10-19-r6x-steering-gpu)/|bin/spark$|scripts/|requirements/|\.github/workflows/validate\.yml$)'; then
            echo steering=true >> "$GITHUB_OUTPUT"
          else
            echo steering=false >> "$GITHUB_OUTPUT"
          fi

  patch-stacks:
    needs: changes
    if: needs.changes.outputs.patches == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        source: [vllm, b12x, nccl, tilelang, tile_kernels]
    steps:
      - uses: actions/checkout@v5
      - name: Use the example site
        run: scripts/example_site.py
      - name: Apply the local series and check the recorded patch head and tree
        run: bin/spark build prepare --only "${{ matrix.source }}"

  request-steering-stack:
    needs: changes
    if: needs.changes.outputs.steering == 'true' || needs.changes.outputs.patches == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Use the example site
        run: scripts/example_site.py
      - name: Use the four-node example map for the isolated experiment
        run: cp config/examples/nodes-ring4.json config/nodes-steering-example.local.json
      - name: Replay and verify all 180 experimental request-steering vLLM patches
        run: bin/spark --shape tp4-ring --cluster-config experiments/2026-10-18-request-steering/cluster.json build prepare --only vllm

  # Keep the previous stack gate; validate the new candidate independently.
  steering-consume-cpu:
    needs: changes
    if: needs.changes.outputs.steering == 'true' || needs.changes.outputs.patches == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Use the example site and isolated four-node map
        run: |
          scripts/example_site.py
          cp config/examples/nodes-ring4.json config/nodes-steering-example.local.json
      - name: Replay the complete optimized steering series and verify its identity
        run: bin/spark --shape tp4-ring --cluster-config experiments/2026-10-18-steering-consume/cluster.json build prepare --only vllm
      - name: Install the hash-pinned CPU gate dependencies
        run: |
          python3 -m venv .work/steering-cpu-venv
          .work/steering-cpu-venv/bin/python -m pip install --require-hashes -r requirements/steering-cpu-linux.txt
      - name: Execute CPU contracts on the verified prepared source
        run: .work/steering-cpu-venv/bin/python scripts/check_steering_cpu.py --upstreams experiments/2026-10-18-steering-consume/upstreams.lock.json --report .work/steering-consume-cpu.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steering-consume-cpu
          path: .work/steering-consume-cpu.xml

  # Keep both historical steering gates and qualify the r6x replay separately.
  steering-r6x-cpu:
    needs: changes
    if: needs.changes.outputs.steering == 'true' || needs.changes.outputs.patches == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Use the example site and isolated four-node map
        run: |
          scripts/example_site.py
          cp config/examples/nodes-ring4.json config/nodes-steering-r6x-example.local.json
      - name: Validate the isolated r6x candidate recipe
        run: bin/spark --shape tp4-ring --cluster-config experiments/2026-10-19-r6x-steering/cluster.json doctor
      - name: Replay all 188 r6x and downstream patches and verify their identity
        run: bin/spark --shape tp4-ring --cluster-config experiments/2026-10-19-r6x-steering/cluster.json build prepare --only vllm
      - name: Install the hash-pinned CPU gate dependencies
        run: |
          python3 -m venv .work/steering-r6x-cpu-venv
          .work/steering-r6x-cpu-venv/bin/python -m pip install --require-hashes -r requirements/steering-cpu-linux.txt
      - name: Execute the complete pinned r6x CPU collection
        run: .work/steering-r6x-cpu-venv/bin/python scripts/check_steering_cpu.py --upstreams experiments/2026-10-19-r6x-steering/upstreams.lock.json --cases experiments/2026-10-19-r6x-steering/cpu-cases.json --report .work/steering-r6x-cpu.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steering-r6x-cpu
          path: .work/steering-r6x-cpu.xml

  # Production applies this experiment's adaptive NCCL series.
  nccl-adaptive-plans:
    needs: changes
    if: needs.changes.outputs.patches == 'true'
    runs-on: ubuntu-24.04
    env:
      BALANCED_TEST_PROFILE: experiments/2026-10-03-balanced-policy/adaptive.json
    steps:
      - uses: actions/checkout@v5
      - run: scripts/example_site.py
      - run: bin/spark --cluster-config experiments/2026-10-03-balanced-policy/adaptive.json build prepare --only nccl
      - run: python3 experiments/2026-10-03-balanced-policy/test-policy.py
      - run: python3 experiments/2026-10-03-balanced-policy/test-allocation.py
      - run: python3 experiments/2026-10-03-balanced-policy/test-threads.py
